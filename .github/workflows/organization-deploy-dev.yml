name: Organization Deploy DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.303'
  BUILD_CONFIGURATION: 'Release'
  API_PROJECT: 'src/TexasMediaDart.Organization.Api/TexasMediaDart.Organization.Api.csproj'
  PUBLISH_PATH: 'publish'
  AZURE_WEBAPP_NAME: 'texasmediadart-organization-dev'

jobs:
  build:
    name: Build Organization API
    runs-on: windows-latest

    outputs:
      build_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Generate build version
        id: version
        shell: pwsh
        run: |
          $date = Get-Date -Format "yyyy.MM.dd"
          $build = "{0:D4}" -f [int]$env:GITHUB_RUN_NUMBER
          $version = "$date.$build"

          "BUILD_VERSION=$version" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

          "version=$version" | Out-File `
            -FilePath $env:GITHUB_OUTPUT `
            -Encoding utf8 `
            -Append

          Write-Host "Organization API Release Version: $version"

          "### Organization API Release Version" >> $env:GITHUB_STEP_SUMMARY
          "**$version**" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore
        run: dotnet restore ${{ env.API_PROJECT }}

      - name: Build
        run: >
          dotnet build ${{ env.API_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore

      - name: Publish Organization API
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          --configuration ${{ env.BUILD_CONFIGURATION }}
          --no-restore
          --output ${{ env.PUBLISH_PATH }}
          /p:InformationalVersion=${{ env.BUILD_VERSION }}
          /p:IncludeSourceRevisionInInformationalVersion=false

      - name: Create versioned API package
        shell: pwsh
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "artifacts" | Out-Null

          $package =
            "artifacts/TexasMediaDart.Organization.Api-$env:BUILD_VERSION.zip"

          Compress-Archive `
            -Path "${{ env.PUBLISH_PATH }}\*" `
            -DestinationPath $package `
            -Force

          Write-Host "Created Organization API package:"
          Write-Host $package

      - name: Upload versioned API artifact
        uses: actions/upload-artifact@v4
        with:
          name: TexasMediaDart.Organization.Api-${{ env.BUILD_VERSION }}
          path: artifacts/TexasMediaDart.Organization.Api-${{ env.BUILD_VERSION }}.zip
          if-no-files-found: error
          retention-days: 30

  deploy-dev:
    name: Deploy Organization API to DEV
    needs: build
    runs-on: windows-latest
    environment: dev

    steps:
      - name: Display API Version
        shell: pwsh
        run: |
          Write-Host "Deploying Organization API Version:"
          Write-Host "${{ needs.build.outputs.build_version }}"

      - name: Download versioned API artifact
        uses: actions/download-artifact@v4
        with:
          name: TexasMediaDart.Organization.Api-${{ needs.build.outputs.build_version }}
          path: artifacts

      - name: Verify API package
        shell: pwsh
        run: |
          $package =
            "artifacts/TexasMediaDart.Organization.Api-${{ needs.build.outputs.build_version }}.zip"

          if (-not (Test-Path $package)) {
              Write-Error "Organization API package was not found:"
              Write-Error $package
              exit 1
          }

          Write-Host "Verified Organization API package:"
          Write-Host $package

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: artifacts/TexasMediaDart.Organization.Api-${{ needs.build.outputs.build_version }}.zip